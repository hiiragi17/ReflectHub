# Dependabot 設定
# - 毎週月曜 9:00(JST)に更新を確認する
# - minor / patch は 1 本の PR にまとめる。major は破壊的変更の確認のため個別の PR にする
# - 公開から 3 日以内の新バージョンは通常の更新の対象外にする(公開直後の不具合や乗っ取りを避けるため)
#   セキュリティ更新にはこの待機は適用されない
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
